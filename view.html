<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>3D Home Tour</title>
  <meta name="description" content="Walk through this home in 3D, place furniture, and check what fits.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
</head>
<body class="viewer">
  <header class="topbar">
    <div class="tb-main">
      <h1 id="addr">Loading home…</h1>
      <div class="meta" id="meta"></div>
    </div>
    <button class="btn" id="btnPhotos" type="button" hidden>Photos</button>
    <a class="btn primary" id="btnApply" hidden data-lead="header">Get pre-approved</a>
  </header>

  <main class="stage" id="stage">
    <div class="hv" id="hv"></div>
    <nav class="room-chips" id="rooms" aria-label="Rooms"></nav>
    <div class="hint" id="hint" hidden></div>

    <div class="toolbar" role="toolbar" aria-label="View controls">
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="orbit" class="on">Dollhouse</button>
        <button type="button" data-mode="walk">Walk</button>
      </div>
      <button class="btn" type="button" id="btnFit">📏 <span class="lbl">Will it fit?</span></button>
      <button class="btn" type="button" id="btnFurn">🛋 <span class="lbl">Furniture</span></button>
      <button class="btn" type="button" id="btnPlan" title="Show the original floor plan on the floor">▦ <span class="lbl">Plan</span></button>
      <button class="btn" type="button" id="btnReset" title="Back to full view">⤢</button>
    </div>

    <aside class="drawer" id="drawerFit" hidden aria-label="Will it fit">
      <header><h2>Will it fit?</h2><button class="icon-btn" data-close type="button" aria-label="Close">✕</button></header>
      <div class="body" id="fitBody"></div>
    </aside>
    <aside class="drawer" id="drawerFurn" hidden aria-label="Furniture">
      <header><h2>Furniture</h2><button class="icon-btn" data-close type="button" aria-label="Close">✕</button></header>
      <div class="body" id="furnBody"></div>
    </aside>

    <div class="walkpad" id="walkpad" hidden>
      <button type="button" data-m="f" aria-label="Forward">▲</button>
      <button type="button" data-m="l" aria-label="Turn left">⟲</button>
      <button type="button" data-m="b" aria-label="Back">▼</button>
      <button type="button" data-m="r" aria-label="Turn right">⟳</button>
    </div>

    <div class="loading" id="loading"><div><h2>Loading the 3D tour…</h2><p>One moment.</p></div></div>
  </main>

  <footer class="brandbar" id="brand"></footer>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photos">
    <button class="lb-btn lb-close" type="button" aria-label="Close">✕</button>
    <button class="lb-btn lb-prev" type="button" aria-label="Previous">‹</button>
    <img alt="">
    <button class="lb-btn lb-next" type="button" aria-label="Next">›</button>
    <div class="cap"></div>
    <div class="lb-thumbs"></div>
  </div>

  <script type="module" src="js/view-page.js"></script>
</body>
</html>
